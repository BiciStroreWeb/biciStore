{% extends 'biciapp/base.html' %}
{% block title %}Iniciar sesión | BiciStore{% endblock %}
{% block content %}
<section class="seccion"><div class="formulario cuenta-form">
<h1>Iniciar sesión</h1><p>Accede con tu correo electrónico o nombre de usuario.</p>
<form method="post">{% csrf_token %}
<label for="correo">Correo electrónico o usuario</label><input id="correo" name="correo" type="text" autocomplete="username" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" autocomplete="current-password" required>
<button class="boton" type="submit">Entrar</button></form>
<p>¿Aún no tienes cuenta? <a href="{% url 'registro' %}">Regístrate aquí</a>.</p>
</div></section>
{% endblock %}

{% extends 'biciapp/base.html' %}
{% block title %}Crear cuenta | BiciStore{% endblock %}
{% block content %}
<section class="seccion"><div class="formulario cuenta-form">
<h1>Crear cuenta</h1><p>Regístrate para disfrutar de BiciStore.</p>
<form method="post">{% csrf_token %}
<label for="nombre">Nombre</label><input id="nombre" name="nombre" type="text" autocomplete="given-name" required>
<label for="apellidos">Apellidos</label><input id="apellidos" name="apellidos" type="text" autocomplete="family-name" required>
<label for="correo">Correo electrónico</label><input id="correo" name="correo" type="email" autocomplete="email" required>
<label for="password">Contraseña</label><input id="password" name="password" type="password" minlength="8" autocomplete="new-password" required>
<label for="confirmar_password">Confirmar contraseña</label><input id="confirmar_password" name="confirmar_password" type="password" minlength="8" autocomplete="new-password" required>
<button class="boton" type="submit">Crear cuenta</button></form>
<p>¿Ya tienes cuenta? <a href="{% url 'iniciar_sesion' %}">Inicia sesión</a>.</p>
</div></section>
{% endblock %}
